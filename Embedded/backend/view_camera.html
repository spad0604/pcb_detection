<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Stream - PCB Inspector</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            margin-bottom: 20px;
        }
        #stream {
            max-width: 90vw;
            max-height: 80vh;
            border: 3px solid #4CAF50;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.3);
        }
        .info {
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(76, 175, 80, 0.2);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>🎥 Live Camera Stream</h1>
    <img id="stream" src="http://127.0.0.1:8000/api/stream/mjpeg" alt="Camera Stream">
    <div class="info">
        📡 MJPEG Stream - Real-time, không giật, low latency
    </div>
</body>
</html>
